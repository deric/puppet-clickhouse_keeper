# This file can be used to customize the files managed by PDK.
#
# See https://github.com/puppetlabs/pdk-templates/blob/main/README.md
# for more information.
#
# See https://github.com/puppetlabs/pdk-templates/blob/main/config_defaults.yml
# for the default values.
---
appveyor.yml:
  delete: true
.travis.yml:
  delete: true
.gitlab-ci.yml:
  delete: true
.editorconfig:
  unmanaged: true
.gitignore:
  paths:
    - '/.vscode/'
    - '/.devcontainer/'
spec/spec_helper.rb:
  coverage_report: true
Gemfile:
  optional:
    ':system_tests':
      - gem: 'voxpupuli-acceptance'
  overrides:
    # voxpupuli-acceptance >= 4 (needed for beaker 7 / Debian 13 hosts) requires
    # puppet-modulebuilder 2.x, which the template defaults of these gems pin below.
    - gem: 'puppet-blacksmith'
      version: ['>= 8.0', '< 10']
    - gem: 'puppet_litmus'
      version: '~> 2.0'
      platforms:
        - ruby
        - x64_mingw
